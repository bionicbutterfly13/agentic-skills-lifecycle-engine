[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-mastery-engine"
version = "0.2.0"
description = "Agent Skill Mastery Engine: runtime-neutral WikiSkill-method skill evolution core with thin runtime adapters"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mani Saint-Victor, MD"}]
license = {text = "MIT"}
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
asme = "asme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asme = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
